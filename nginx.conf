server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # El widget se actualiza a menudo: que el navegador compruebe si hay versión nueva
  location /widget/ {
    add_header Cache-Control "no-cache";
  }

  # El micrófono (agente de voz) solo se permite en esta propia web
  add_header Permissions-Policy "microphone=(self)" always;
}
